
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập CSS - Bài 4</title>

    <style>
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: inline-block;
            width: 140px;
            background-color: aqua;
            text-align: center;
            margazin-right: 4px;
        }

        a {
            font-size: 28px;
            color: blue;
        }
    </style>
</head>

<body>

    <ul>
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>

</body>
</html>
