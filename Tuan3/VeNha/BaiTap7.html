
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập CSS - Bài 7</title>

    <style>
        /* Khung chứa chính */
        #wrapper {
            width: 220px;
            margin: 30px auto;
            padding: 5px;
            border: 2px solid black;

            display: grid;
            grid-template-columns: 20% 1fr;
            grid-template-rows: 45px 190px 35px;
            gap: 5px;
        }

        /* Header */
        header {
            grid-column: 1 / 3;
            border: 2px solid black;
            padding: 8px;
        }

        /* Navigation */
        nav {
            border: 2px solid black;
            padding: 8px;
        }

        /* Main content */
        main {
            border: 2px solid black;
            padding: 8px;
        }

        /* Footer */
        footer {
            grid-column: 1 / 3;
            border: 2px solid black;
            padding: 8px;
        }
    </style>
</head>

<body>

    <div id="wrapper">
        <header>header</header>
        <nav>nav</nav>
        <main>main</main>
        <footer>footer</footer>
    </div>

</body>
</html>
