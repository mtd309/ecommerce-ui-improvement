
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Học web chuẩn</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .portfolio {
            width: 100%;
            max-width: 826px;
            margin: 20px auto;
            background-color: #f7f7f7;
            text-align: center;
            padding-top: 18px;
        }

        /* Tiêu đề */
        .portfolio h2 {
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin: 0;
        }

        .portfolio h2::after {
            content: "";
            display: block;
            width: 56px;
            height: 2px;
            background-color: #42aaa5;
            margin: 12px auto 24px;
        }

        /* Danh mục */
        .list-tab {
            list-style: none;
            padding: 0;
            margin: 0 0 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .list-tab li a {
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #555;
            text-decoration: none;
        }

        .list-tab li:first-child a {
            color: #42aaa5;
        }

        /* Gallery */
        .galerry {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .galerry li {
            width: 100%;
            aspect-ratio: 350 / 260;
            background-color: #9ccc7c;
        }

        .galerry li a {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        /* Chữ hiển thị trong từng ô */
        .galerry li a::after {
            content: "Học Web Chuẩn";
            font-family: Arial, sans-serif;
            font-size: 23px;
            color: #eaf4df;
            font-weight: normal;
        }

        /* Ẩn ảnh cũ, giữ nguyên các thẻ img trong HTML */
        .galerry img {
            display: none;
        }
    </style>
</head>

<body>

    <section class="portfolio">
